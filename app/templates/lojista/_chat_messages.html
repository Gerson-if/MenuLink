<div id="chat-messages" class="chat-messages" hx-get="{{ url_for('lojista.chat_messages_fragment') }}" hx-trigger="every 5s" hx-swap="outerHTML" hx-select="#chat-messages">
  {% if messages %}
  {% for message in messages %}
  <div class="chat-bubble-row {{ 'chat-bubble-row-own' if message.sender_role.value == 'lojista' else '' }}">
    <div class="chat-bubble {{ 'chat-bubble-own' if message.sender_role.value == 'lojista' else 'chat-bubble-other' }}">
      <div class="chat-bubble-sender">{{ "Você" if message.sender_role.value == "lojista" else "Suporte Comanda" }}</div>
      <div class="chat-bubble-body">{{ message.body }}</div>
      <div class="chat-bubble-time">{{ message.created_at.strftime("%d/%m %H:%M") }}</div>
    </div>
  </div>
  {% endfor %}
  {% else %}
  <p class="text-muted-custom small text-center py-4">Nenhuma mensagem ainda — mande um "oi" pro suporte 👋</p>
  {% endif %}
</div>
<script>
  (function () {
    var el = document.getElementById('chat-messages');
    if (el) el.scrollTop = el.scrollHeight;
  })();
</script>
