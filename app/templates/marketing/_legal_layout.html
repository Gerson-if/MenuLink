{% extends "base.html" %}
{% block body_class %}theme-chili{% endblock %}

{% block extra_head %}
<style>
  .legal-nav {
    background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--card-border); padding: 16px 0;
  }
  .legal-content { max-width: 760px; margin: 0 auto; padding: 56px 20px 80px; }
  .legal-content h1 { font-size: 1.9rem; margin-bottom: 4px; }
  .legal-content .legal-updated { color: var(--text-faint); font-size: .85rem; margin-bottom: 36px; }
  .legal-content h2 { font-size: 1.15rem; margin-top: 36px; margin-bottom: 12px; color: var(--card-text); }
  .legal-content p, .legal-content li { color: var(--text-dim); line-height: 1.7; }
  .legal-content ul { padding-left: 1.2rem; }
  .legal-content li { margin-bottom: 6px; }
  .legal-content a { color: var(--accent); }
</style>
{% endblock %}

{% block content %}
<nav class="legal-nav">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="{{ url_for('index') }}">
      <div class="brand-mark" style="width:32px;height:32px;font-size:1rem;"><i class="bi bi-egg-fried text-white"></i></div>
      <span class="font-display text-white" style="font-size:1.05rem; line-height:1;">COMANDA</span>
    </a>
  </div>
</nav>

<div class="legal-content">
  <a href="{{ url_for('index') }}" class="link-chili small d-inline-block mb-4"><i class="bi bi-arrow-left"></i> Voltar para o site</a>
  {% block legal_content %}{% endblock %}
</div>
{% endblock %}
